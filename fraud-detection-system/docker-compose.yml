version: '3.8'

services:
  dashboard:
    build: ./dashboard
    ports:
      - "8050:8050"
    volumes:
      - ./dashboard:/app
    depends_on:
      - api
    environment:
      - PYTHONUNBUFFERED=1

  api:
    build: ./api
    ports:
      - "5000:5000"
    volumes:
      - ./api:/app
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  dashboard_data:
  api_data: